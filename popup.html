<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1b1b1f;
        --muted: #8a8a93;
        --card: #f3f4f8;
        --card-hover: #e8eaf2;
        --accent: #5b6cff;
        --ok: #22a06b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c22;
          --fg: #f2f2f5;
          --muted: #8a8a93;
          --card: #2a2a33;
          --card-hover: #34343f;
          --accent: #8a96ff;
          --ok: #4cd09a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 8px;
        width: 150px;
        background: var(--bg);
        color: var(--fg);
        font: 13px system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      #copy {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 6px 7px;
        border-radius: 10px;
        background: var(--card);
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      #copy:hover { background: var(--card-hover); }
      #copy:active { transform: scale(0.97); }
      #copy:focus-visible { outline: 2px solid var(--accent); }
      #code {
        font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.15em;
        padding-left: 0.15em;
      }
      #icon { color: var(--muted); display: flex; }
      #copy.done #icon { color: var(--ok); }
      svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .check { display: none; }
      .done .check { display: block; }
      .done .copy-icon { display: none; }
      .msg { color: var(--muted); }
      .row { margin-top: 6px; }
      #autosign, #setsig {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        padding: 6px 7px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      #autosign { background: var(--accent); color: #fff; font-weight: 600; }
      #autosign:active, #setsig:active { transform: scale(0.97); }
      #autosign:focus-visible, #setsig:focus-visible { outline: 2px solid var(--accent); }
      #setsig { color: var(--muted); font-size: 11px; padding: 3px; }
      #setsig:hover { color: var(--fg); }
    </style>
  </head>
  <body>
    <button id="copy" title="Fill code" hidden>
      <span id="code"></span>
      <span id="icon">
        <svg class="copy-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>
        <svg class="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </button>
    <div class="row"><button id="autosign" title="Fill the code, then load your saved signature" hidden>AutoSign</button></div>
    <div class="row"><button id="setsig">Set signature…</button></div>
    <div id="msg" class="msg">Loading…</div>
    <script src="code.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
