<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SoWeSketch - Signature</title>
    <style>
      :root { --bg: #fff; --fg: #1b1b1f; --muted: #8a8a93; --card: #f3f4f8; --accent: #5b6cff; --err: #d33; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1c1c22; --fg: #f2f2f5; --card: #2a2a33; --accent: #8a96ff; --err: #ff7b7b; }
      }
      body { margin: 0; padding: 24px; max-width: 480px; background: var(--bg); color: var(--fg); font: 14px system-ui, -apple-system, sans-serif; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { color: var(--muted); margin: 0 0 16px; }
      #preview { display: block; max-width: 100%; max-height: 200px; margin-bottom: 16px; background: #fff; border: 1px solid var(--card); border-radius: 8px; }
      button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--card); color: var(--fg); cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; }
      #msg { margin-top: 12px; color: var(--muted); }
      #msg.err { color: var(--err); }
    </style>
  </head>
  <body>
    <h1>Your signature</h1>
    <p>Choose a JPG image of your signature. It is stored locally in the extension and used by AutoSign.</p>
    <img id="preview" alt="Saved signature" hidden />
    <input type="file" id="file" accept="image/jpeg" hidden />
    <button id="choose" class="primary">Choose a JPG…</button>
    <button id="remove" hidden>Remove</button>
    <div id="msg"></div>
    <script src="options.js"></script>
  </body>
</html>
